<body>
  <div id="bgfx" aria-hidden="true"></div>
  <div class="screen">
    <div class="term">
      <pre id="log"></pre>
      <div class="idwrap">
        <div class="bot" id="bot" aria-hidden="true"><div class="bot-spin">
          <div class="layer back">
            <svg viewBox="0 0 120 150">
              <rect x="35" y="39" width="50" height="60" rx="19" fill="currentColor" opacity=".10"/>
              <path d="M41 104 L79 104 L87 150 L33 150 Z" fill="currentColor" opacity=".07"/>
            </svg>
          </div>
          <div class="layer mid">
            <svg viewBox="0 0 120 150" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
              <!-- antennae (Chappie's signature bunny-ears) -->
              <g class="ear l"><path d="M51 42 L45 14" stroke-width="4.5"/><circle cx="44" cy="11.5" r="3.4" fill="currentColor" stroke="none"/></g>
              <g class="ear r"><path d="M69 42 L75 14" stroke-width="4.5"/><circle cx="76" cy="11.5" r="3.4" fill="currentColor" stroke="none"/></g>
              <!-- arms -->
              <path d="M23 121 Q16 124 17 134 L20 150 L31 150 L31 130 Q31 122 25 120 Z" stroke-width="2" fill="currentColor" fill-opacity=".04"/>
              <path d="M97 121 Q104 124 103 134 L100 150 L89 150 L89 130 Q89 122 95 120 Z" stroke-width="2" fill="currentColor" fill-opacity=".04"/>
              <!-- torso -->
              <path d="M44 105 L76 105 L82 119 Q84 124 84 132 L84 150 L36 150 L36 132 Q36 124 38 119 Z" stroke-width="2.6" fill="currentColor" fill-opacity=".05"/>
              <path d="M45 111 L75 111" stroke-width="1.4" opacity=".5"/>
              <path d="M60 111 L60 120" stroke-width="1.2" opacity=".4"/>
              <!-- shoulders -->
              <ellipse cx="30" cy="118" rx="13" ry="10" stroke-width="2.2" fill="currentColor" fill-opacity=".05"/>
              <ellipse cx="90" cy="118" rx="13" ry="10" stroke-width="2.2" fill="currentColor" fill-opacity=".05"/>
              <circle cx="30" cy="118" r="2" fill="currentColor" stroke="none"/>
              <circle cx="90" cy="118" r="2" fill="currentColor" stroke="none"/>
              <!-- neck -->
              <path d="M53 98 L52 106 L68 106 L67 98" stroke-width="2" fill="currentColor" fill-opacity=".08"/>
              <path d="M50 100 L50 107 M70 100 L70 107" stroke-width="1.2" opacity=".5"/>
              <!-- head -->
              <path d="M44 40 Q34 40 34 52 L34 79 Q34 94 50 98 L70 98 Q86 94 86 79 L86 52 Q86 40 76 40 Z" stroke-width="2.6" fill="currentColor" fill-opacity=".05"/>
              <circle cx="51" cy="42" r="2" fill="currentColor" stroke="none"/>
              <circle cx="69" cy="42" r="2" fill="currentColor" stroke="none"/>
              <!-- visor -->
              <path d="M38 56 L82 56 Q85 56 85 61 L85 70 Q85 75 80 75 L40 75 Q35 75 35 70 L35 61 Q35 56 38 56 Z" stroke-width="1.6" fill="currentColor" fill-opacity=".12"/>
              <circle cx="38.5" cy="65.5" r="1.5" fill="currentColor" stroke="none"/>
              <circle cx="81.5" cy="65.5" r="1.5" fill="currentColor" stroke="none"/>
              <!-- mouth grille -->
              <path d="M49 80 L71 80 Q73 80 73 83 L73 88 Q73 90 71 90 L49 90 Q47 90 47 88 L47 83 Q47 80 49 80 Z" stroke-width="1.4" opacity=".75"/>
              <path d="M53 81 L53 89 M58 81 L58 89 M62 81 L62 89 M67 81 L67 89" stroke-width="1.1" opacity=".5"/>
              <!-- chest panel -->
              <rect x="49" y="120" width="22" height="24" rx="3" stroke-width="1.5" fill="currentColor" fill-opacity=".09"/>
              <path d="M53 135 L67 135 M53 139 L67 139" stroke-width="1.1" opacity=".5"/>
            </svg>
          </div>
          <div class="layer glow">
            <svg viewBox="0 0 120 150">
              <rect x="42" y="59" width="15" height="9" rx="4.2" fill="currentColor"/>
              <rect x="63" y="59" width="15" height="9" rx="4.2" fill="currentColor"/>
              <circle cx="60" cy="126" r="2.6" fill="currentColor"/>
            </svg>
          </div>
        </div></div>
        <div id="id">@SIMMZL</div>
      </div>
      <div id="history"></div>
      <div id="prompt"><span class="ps1" id="ps1">guest@simmzl:~$ </span><span id="cmd"></span></div>
    </div>
  </div>
  <input id="cli" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="terminal input" />

  <div class="sweep"></div>
  <div class="scan"></div>
  <div class="vig"></div>
  <div class="glass"></div>
  <div id="halt"><div class="h1">● SYSTEM HALTED</div><div class="h2">press [ENTER] to power on</div></div>

  <audio id="bgm" loop preload="auto">
    <source src="https://static.simmzl.cn/audio/bgm.ogg" type="audio/ogg; codecs=opus" />
    <source src="https://static.simmzl.cn/audio/bgm.mp3" type="audio/mpeg" />
  </audio>
  <button id="bgm-toggle" type="button" aria-label="toggle background music" aria-pressed="false"><span class="lbl">BGM OFF</span></button>

  <footer id="beian"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noreferrer noopener">豫ICP备17015568号-1</a></footer>

  <script type="module" src="./assets/js/terminal.js"></script>

  <!-- (6) background music — opt-in via the in-terminal prompt (or the top-right toggle).
       enabling fires a phosphor beam from the input box up to the toggle. -->
  <script type="module" src="./assets/js/bgm.js"></script>
