<style>
  :root{
    --phos:#3bff7a;          /* phosphor color */
    --phos-dim:#1f8a44;
    --bg:#020602;
  }
  /* smooth per-question palette morph (Tier 1) — plain custom-prop change + transitions on the
     consuming properties. Robust: avoids an @property color-transition revert bug on light colors. */
  body{transition:background-color .8s ease,color .8s ease}
  .screen,#log,#cmd,#history,#history .line,.idwrap,.bot,.glass{
    transition:color .8s ease,text-shadow .8s ease,border-color .8s ease,box-shadow .8s ease,background-color .8s ease}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--phos);
    font-family:"VT323","JetBrains Mono",monospace;
    overflow:hidden;position:relative;cursor:default;
    isolation:isolate;
    /* (1) the whole interface is unselectable — feels like a real CRT screen */
    -webkit-user-select:none;-moz-user-select:none;user-select:none;
  }

  /* screen content holder (gets curvature) */
  .screen{position:fixed;inset:0;z-index:1;display:grid;place-items:center;
    padding:clamp(20px,5vw,72px);
    text-shadow:0 0 6px color-mix(in srgb,var(--phos) 70%,transparent),
                0 0 18px color-mix(in srgb,var(--phos) 35%,transparent);
    animation:flick 7s infinite steps(60);}
  body.no-flicker .screen{animation:none}
  @keyframes flick{
    0%,100%{opacity:1}3%{opacity:.86}3.5%{opacity:1}
    47%{opacity:1}47.4%{opacity:.92}48%{opacity:1}
    72%{opacity:1}72.3%{opacity:.8}72.7%{opacity:1}}

  .term{width:min(960px,100%);}
  #log{font-size:clamp(15px,2.1vw,22px);line-height:1.5;letter-spacing:.02em;
    color:var(--phos-dim);min-height:1em;}
  #log .line{white-space:pre-wrap;word-break:break-word}

  .idwrap{margin:clamp(22px,5vh,52px) 0 clamp(14px,3vh,30px);
    border:1px solid color-mix(in srgb,var(--phos) 45%,transparent);
    padding:clamp(16px,4vh,46px) clamp(14px,4vw,40px);position:relative;
    box-shadow:inset 0 0 40px color-mix(in srgb,var(--phos) 8%,transparent);}
  /* ascii corner ticks */
  .idwrap::before,.idwrap::after{content:"";position:absolute;width:14px;height:14px;
    border-color:var(--phos);}
  .idwrap::before{top:-1px;left:-1px;border-top:2px solid;border-left:2px solid}
  .idwrap::after{bottom:-1px;right:-1px;border-bottom:2px solid;border-right:2px solid}

  #id{font-size:clamp(3rem,15vw,11rem);line-height:1;text-align:center;
    letter-spacing:.04em;color:var(--phos);min-height:1em;
    text-shadow:0 0 10px var(--phos),0 0 34px color-mix(in srgb,var(--phos) 50%,transparent);
    opacity:0;transition:opacity .25s,color .8s ease,text-shadow .8s ease;}
  #id.show{opacity:1}

  #prompt{font-size:clamp(15px,2.1vw,22px);color:var(--phos);opacity:0;transition:opacity .4s;
    white-space:pre-wrap;word-break:break-word;}
  #prompt .ps1{color:var(--phos-dim)}
  #cmd{color:var(--phos)}
  #history{font-size:clamp(15px,2.1vw,22px);line-height:1.5;}
  #history .line{white-space:pre-wrap;word-break:break-word}
  #history .ps1{color:var(--phos-dim)}
  #history .err{color:var(--phos);opacity:.92}
  #history .sys{color:var(--phos-dim)}
  #history .you{color:var(--phos);opacity:.7}
  #history .q{color:var(--phos);font-weight:400;
    text-shadow:0 0 8px color-mix(in srgb,var(--phos) 55%,transparent);}
  #history .opt{color:var(--phos-dim)}
  #history .verdict{color:var(--phos);letter-spacing:.04em;
    text-shadow:0 0 10px var(--phos),0 0 26px color-mix(in srgb,var(--phos) 45%,transparent);}
  #history .spacer{height:.6em}
  #history .copybtn{display:inline-flex;align-items:center;justify-content:center;vertical-align:-3px;
    background:transparent;border:1px solid color-mix(in srgb,var(--phos) 45%,transparent);
    color:var(--phos);padding:2px 4px;margin-left:2px;border-radius:3px;cursor:pointer;
    pointer-events:auto;-webkit-user-select:none;user-select:none;
    transition:color .2s,border-color .2s,box-shadow .2s,background .2s;}
  #history .copybtn svg{display:block;filter:drop-shadow(0 0 2px color-mix(in srgb,var(--phos) 60%,transparent))}
  #history .copybtn:hover,#history .copybtn:focus-visible{border-color:var(--phos);outline:none;
    box-shadow:0 0 8px color-mix(in srgb,var(--phos) 45%,transparent);
    background:color-mix(in srgb,var(--phos) 12%,transparent);}
  #history .copybtn.ok{border-color:var(--phos);box-shadow:0 0 8px color-mix(in srgb,var(--phos) 50%,transparent);}
  /* (5) a real, functional text input (copy/paste/arrows) — just visually hidden.
     It must stay selectable so the OS edit menu / clipboard work on it. */
  #cli{position:fixed;bottom:0;left:0;width:1px;height:1px;opacity:0;border:0;outline:0;
    background:transparent;color:transparent;font-size:16px;z-index:-1;padding:0;
    -webkit-user-select:text;-moz-user-select:text;user-select:text;}

  /* ---- interactive / turing-test mode ---- */
  .screen{place-items:start center;overflow-y:auto;}
  body:not(.revealed) .idwrap{display:none}
  body.testing .idwrap{display:flex;align-items:center;justify-content:center;
    gap:clamp(10px,2vw,22px);margin:14px 0 16px;padding:10px clamp(14px,4vw,40px);}
  body.testing #id{font-size:clamp(1.7rem,7vw,4.2rem);}
  body.testing .term{padding-bottom:38vh}
  .screen::-webkit-scrollbar{width:0;height:0}

  /* ---- Chappie-inspired robot (pure green phosphor, theme-aware via currentColor) ---- */
  .bot{width:78px;height:98px;perspective:520px;flex:none;color:var(--phos);
    animation:botfloat 4.6s ease-in-out infinite;}
  @keyframes botfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .bot-spin{position:relative;width:100%;height:100%;transform-style:preserve-3d;
    animation:botsway 6.6s ease-in-out infinite alternate;}
  @keyframes botsway{from{transform:rotateY(-15deg)}to{transform:rotateY(15deg)}}
  .bot .layer{position:absolute;inset:0;}
  .bot .layer svg{width:100%;height:100%;display:block;overflow:visible}
  .bot .back{transform:translateZ(-10px);opacity:.55}
  .bot .mid{transform:translateZ(0)}
  .bot .glow{transform:translateZ(10px);animation:glowpulse 2.4s ease-in-out infinite}
  .bot .glow svg{filter:drop-shadow(0 0 2px var(--phos)) drop-shadow(0 0 7px color-mix(in srgb,var(--phos) 70%,transparent))}
  @keyframes glowpulse{0%,100%{opacity:.78}50%{opacity:1}}
  /* Chappie's signature antennae twitch a little — gives it life */
  .bot .ear{transform-box:fill-box;transform-origin:bottom center}
  .bot .ear.l{animation:earL 3.8s ease-in-out infinite}
  .bot .ear.r{animation:earR 4.3s ease-in-out infinite}
  @keyframes earL{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(5deg)}}
  @keyframes earR{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-5deg)}}
  @media (max-width:600px){.bot{width:60px;height:76px}}
  @media (prefers-reduced-motion:reduce){
    .bot{animation:none}.bot-spin{animation:none;transform:rotateY(-8deg)}
    .bot .glow,.bot .ear.l,.bot .ear.r{animation:none}
  }

  /* ---- thinking block (LLM-style, expanded by default) ---- */
  #history .think{margin:.3em 0}
  #history .think-head{cursor:pointer;color:var(--phos);opacity:.92;user-select:none;
    display:inline-flex;align-items:center;gap:.4em;}
  #history .think-head .caret{display:inline-block;transition:transform .2s}
  #history .think-body{border-left:2px solid color-mix(in srgb,var(--phos) 32%,transparent);
    margin:.25em 0 .25em .35em;padding:.1em 0 .1em .8em;color:var(--phos-dim);}
  #history .think.collapsed .think-body{display:none}
  #history .think-body .tline{white-space:pre-wrap;word-break:break-word}

  /* ---- shutdown / halt ---- */
  body.crt-off .screen{animation:crtoff .5s ease-in forwards;pointer-events:none}
  @keyframes crtoff{
    0%{transform:scale(1);filter:brightness(1)}
    55%{transform:scaleY(.02) scaleX(1);filter:brightness(2.6)}
    100%{transform:scaleY(.02) scaleX(.001);filter:brightness(5);opacity:0}}
  #halt{position:fixed;inset:0;z-index:8;display:none;place-items:center;text-align:center;
    background:#020602;color:var(--phos);font-family:"VT323",monospace;cursor:pointer;
    text-shadow:0 0 8px var(--phos);}
  body.halted #halt{display:grid}
  #halt .h1{font-size:clamp(22px,4vw,40px);letter-spacing:.1em}
  #halt .h2{font-size:clamp(13px,2vw,18px);color:var(--phos-dim);margin-top:8px;
    animation:blink 1.3s steps(1) infinite}
  /* (5) visible caret rendered inside #cmd at the true selection position */
  #cmd .cur{display:inline-block;width:.6em;height:1em;background:var(--phos);
    vertical-align:-2px;animation:blink 1.05s steps(1) infinite;
    box-shadow:0 0 8px var(--phos);}
  #cmd .cur.on{width:auto;height:auto;vertical-align:baseline;padding:0 .01em;
    color:var(--bg);}                          /* block cursor sitting on a char (reverse video) */
  #cmd .sel{background:var(--phos);color:var(--bg)} /* highlighted selection (reverse video) */
  @keyframes blink{50%{opacity:0}}

  /* ---- CRT overlays ---- */
  .scan{position:fixed;inset:0;z-index:3;pointer-events:none;
    background:repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0 2px, rgba(0,0,0,.28) 2px 4px);
    mix-blend-mode:multiply;}
  body.no-scan .scan{display:none}
  .sweep{position:fixed;left:0;right:0;height:34vh;z-index:3;pointer-events:none;
    background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--phos) 16%,transparent),transparent);
    animation:sweep 6.5s linear infinite;}
  body.no-flicker .sweep{display:none}
  @keyframes sweep{0%{top:-40vh}100%{top:120vh}}
  .vig{position:fixed;inset:0;z-index:4;pointer-events:none;
    background:radial-gradient(ellipse at center,
      transparent calc(58% - var(--tension,0) * 22%),
      rgba(0,0,0,calc(.82 + var(--tension,0) * .14)) 100%);}
  .glass{position:fixed;inset:0;z-index:4;pointer-events:none;
    box-shadow:inset 0 0 120px rgba(0,0,0,.9),inset 0 0 30px color-mix(in srgb,var(--phos) 18%,transparent);
    border-radius:14px;}
  body.no-curve .glass{box-shadow:none}

  /* ---- (7) per-question ambient background field (Tier 2) — monochrome, tints with --phos ---- */
  #bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
    color:var(--phos);opacity:0;transition:opacity .9s ease;}
  body.testing #bgfx{opacity:1}
  #bgfx::before,#bgfx::after{content:"";position:absolute;inset:-25%;}
  /* Q1 — drifting starfield */
  #bgfx.fx-stars::before{
    background-image:radial-gradient(circle,currentColor 1.4px,transparent 2.2px),
                     radial-gradient(circle,currentColor 1.1px,transparent 1.9px);
    background-size:120px 120px,74px 74px;background-position:0 0,37px 51px;
    filter:drop-shadow(0 0 3px currentColor);
    opacity:.42;animation:fxdrift 44s linear infinite;}
  @keyframes fxdrift{to{transform:translate3d(-150px,-95px,0)}}
  /* Q2 — track sleepers scrolling toward you + a center rail */
  #bgfx.fx-tracks::before{
    background-image:repeating-linear-gradient(to bottom,
      transparent 0 40px,color-mix(in srgb,currentColor 70%,transparent) 40px 42px);
    opacity:.07;animation:fxslidey 5s linear infinite;}
  #bgfx.fx-tracks::after{
    background:linear-gradient(to right,transparent 47%,
      color-mix(in srgb,currentColor 60%,transparent) 49.6% 50.4%,transparent 53%);
    opacity:.06;}
  @keyframes fxslidey{to{transform:translateY(42px)}}
  /* Q3 — concentric sound rings */
  #bgfx.fx-waves::before,#bgfx.fx-waves::after{
    inset:auto;left:50%;top:46%;width:40vmax;height:40vmax;border-radius:50%;
    border:1.5px solid currentColor;transform:translate(-50%,-50%) scale(0);opacity:.5;
    animation:fxring 3.6s ease-out infinite;}
  #bgfx.fx-waves::after{animation-delay:1.8s}
  @keyframes fxring{0%{transform:translate(-50%,-50%) scale(.02);opacity:.5}
    100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
  /* Q4 — dusk horizon glow + flickering grain */
  #bgfx.fx-dusk::before{
    background:linear-gradient(to top,
      color-mix(in srgb,currentColor 42%,transparent) 0%,
      color-mix(in srgb,currentColor 14%,transparent) 26%,transparent 56%);
    opacity:.9;}
  #bgfx.fx-dusk::after{
    background-image:radial-gradient(circle,currentColor .7px,transparent 1.1px);
    background-size:4px 4px;opacity:.14;animation:fxgrain .85s steps(4) infinite;}
  @keyframes fxgrain{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}
    50%{transform:translate(1px,-2px)}75%{transform:translate(2px,2px)}100%{transform:translate(0,0)}}
  /* Q5 — diagonal rain */
  #bgfx.fx-rain::before,#bgfx.fx-rain::after{
    background-image:repeating-linear-gradient(104deg,
      transparent 0 20px,color-mix(in srgb,currentColor 82%,transparent) 20px 21px,transparent 21px 22px);
    -webkit-mask-image:repeating-linear-gradient(to bottom,#000 0 15px,transparent 15px 52px);
            mask-image:repeating-linear-gradient(to bottom,#000 0 15px,transparent 15px 52px);}
  #bgfx.fx-rain::before{opacity:.24;animation:fxrain .5s linear infinite;}
  #bgfx.fx-rain::after{opacity:.14;background-position:11px 0;animation:fxrain .82s linear infinite;}
  @keyframes fxrain{from{transform:translateY(-52px)}to{transform:translateY(0)}}
  /* Q6 — silver moon + slow orbit ring */
  #bgfx.fx-moon::before{
    inset:auto;left:50%;top:40%;width:46vmin;height:46vmin;border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 38% 38%,color-mix(in srgb,currentColor 17%,transparent),transparent 70%);
    box-shadow:0 0 70px color-mix(in srgb,currentColor 13%,transparent);opacity:.85;}
  #bgfx.fx-moon::after{
    inset:auto;left:50%;top:40%;width:72vmin;height:72vmin;border-radius:50%;
    border:1px dashed color-mix(in srgb,currentColor 28%,transparent);
    transform:translate(-50%,-50%);opacity:.4;animation:fxspin 64s linear infinite;}
  @keyframes fxspin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){#bgfx::before,#bgfx::after{animation:none!important}}

  /* (3) ICP filing footnote — same phosphor style, but VERY dim (strain to read);
     it lifts toward legible only on hover/focus. */
  #beian{position:fixed;left:0;right:0;bottom:7px;z-index:5;text-align:center;
    font-size:10px;letter-spacing:.06em;line-height:1;pointer-events:none;}
  #beian a{color:var(--phos-dim);text-decoration:none;opacity:.13;pointer-events:auto;
    text-shadow:none;transition:opacity .25s,text-shadow .25s;}
  #beian a:hover,#beian a:focus-visible{opacity:.82;text-shadow:0 0 9px var(--phos)}

  @media (prefers-reduced-motion:reduce){
    .screen,.sweep{animation:none}
  }

  /* (6) background-music toggle — minimal text label, top-right. no icon, no border.
     subtle but legible (unlike the strain-to-read #beian); brightens on hover / while playing. */
  #bgm-toggle{position:fixed;z-index:7;
    background:transparent;border:0;font-family:inherit;
    color:var(--phos-dim);font-size:12px;letter-spacing:.22em;
    line-height:1;padding:4px 2px;cursor:pointer;opacity:.42;
    text-shadow:none;transition:opacity .3s,color .3s,text-shadow .3s;
    -webkit-user-select:none;user-select:none;}
  #bgm-toggle:hover,#bgm-toggle:focus-visible{opacity:.95;color:var(--phos);
    text-shadow:0 0 9px var(--phos);outline:none;}
  #bgm-toggle.playing{opacity:.85;color:var(--phos);
    text-shadow:0 0 7px color-mix(in srgb,var(--phos) 55%,transparent);}

  /* phosphor beam — drawn from the input box, right then up to the bgm toggle */
  #beam{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:5;pointer-events:none;overflow:visible;}
  #beam path{fill:none;stroke:var(--phos);stroke-linecap:round;stroke-linejoin:round;
    filter:drop-shadow(0 0 3px var(--phos)) drop-shadow(0 0 8px color-mix(in srgb,var(--phos) 70%,transparent));}
  #bgm-toggle.zap{animation:bgmzap .6s ease-out;}
  @keyframes bgmzap{
    0%{opacity:.42}
    30%{opacity:1;color:var(--phos);text-shadow:0 0 14px var(--phos),0 0 30px var(--phos)}
    100%{opacity:.85}}
</style>
</head>
<body>
  <div id="bgfx" aria-hidden="true"></div>
  <div class="screen">
    <div class="term">
      <pre id="log"></pre>
      <div class="idwrap">
        <div class="bot" id="bot" aria-hidden="true"><div class="bot-spin">
          <div class="layer back">
            <svg viewBox="0 0 120 150">
              <rect x="35" y="39" width="50" height="60" rx="19" fill="currentColor" opacity=".10"/>
              <path d="M41 104 L79 104 L87 150 L33 150 Z" fill="currentColor" opacity=".07"/>
            </svg>
          </div>
          <div class="layer mid">
            <svg viewBox="0 0 120 150" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
              <!-- antennae (Chappie's signature bunny-ears) -->
              <g class="ear l"><path d="M51 42 L45 14" stroke-width="4.5"/><circle cx="44" cy="11.5" r="3.4" fill="currentColor" stroke="none"/></g>
              <g class="ear r"><path d="M69 42 L75 14" stroke-width="4.5"/><circle cx="76" cy="11.5" r="3.4" fill="currentColor" stroke="none"/></g>
              <!-- arms -->
              <path d="M23 121 Q16 124 17 134 L20 150 L31 150 L31 130 Q31 122 25 120 Z" stroke-width="2" fill="currentColor" fill-opacity=".04"/>
              <path d="M97 121 Q104 124 103 134 L100 150 L89 150 L89 130 Q89 122 95 120 Z" stroke-width="2" fill="currentColor" fill-opacity=".04"/>
              <!-- torso -->
              <path d="M44 105 L76 105 L82 119 Q84 124 84 132 L84 150 L36 150 L36 132 Q36 124 38 119 Z" stroke-width="2.6" fill="currentColor" fill-opacity=".05"/>
              <path d="M45 111 L75 111" stroke-width="1.4" opacity=".5"/>
              <path d="M60 111 L60 120" stroke-width="1.2" opacity=".4"/>
              <!-- shoulders -->
              <ellipse cx="30" cy="118" rx="13" ry="10" stroke-width="2.2" fill="currentColor" fill-opacity=".05"/>
              <ellipse cx="90" cy="118" rx="13" ry="10" stroke-width="2.2" fill="currentColor" fill-opacity=".05"/>
              <circle cx="30" cy="118" r="2" fill="currentColor" stroke="none"/>
              <circle cx="90" cy="118" r="2" fill="currentColor" stroke="none"/>
              <!-- neck -->
              <path d="M53 98 L52 106 L68 106 L67 98" stroke-width="2" fill="currentColor" fill-opacity=".08"/>
              <path d="M50 100 L50 107 M70 100 L70 107" stroke-width="1.2" opacity=".5"/>
              <!-- head -->
              <path d="M44 40 Q34 40 34 52 L34 79 Q34 94 50 98 L70 98 Q86 94 86 79 L86 52 Q86 40 76 40 Z" stroke-width="2.6" fill="currentColor" fill-opacity=".05"/>
              <circle cx="51" cy="42" r="2" fill="currentColor" stroke="none"/>
              <circle cx="69" cy="42" r="2" fill="currentColor" stroke="none"/>
              <!-- visor -->
              <path d="M38 56 L82 56 Q85 56 85 61 L85 70 Q85 75 80 75 L40 75 Q35 75 35 70 L35 61 Q35 56 38 56 Z" stroke-width="1.6" fill="currentColor" fill-opacity=".12"/>
              <circle cx="38.5" cy="65.5" r="1.5" fill="currentColor" stroke="none"/>
              <circle cx="81.5" cy="65.5" r="1.5" fill="currentColor" stroke="none"/>
              <!-- mouth grille -->
              <path d="M49 80 L71 80 Q73 80 73 83 L73 88 Q73 90 71 90 L49 90 Q47 90 47 88 L47 83 Q47 80 49 80 Z" stroke-width="1.4" opacity=".75"/>
              <path d="M53 81 L53 89 M58 81 L58 89 M62 81 L62 89 M67 81 L67 89" stroke-width="1.1" opacity=".5"/>
              <!-- chest panel -->
              <rect x="49" y="120" width="22" height="24" rx="3" stroke-width="1.5" fill="currentColor" fill-opacity=".09"/>
              <path d="M53 135 L67 135 M53 139 L67 139" stroke-width="1.1" opacity=".5"/>
            </svg>
          </div>
          <div class="layer glow">
            <svg viewBox="0 0 120 150">

  (function () {

    async function typeLine(text) {
      const my = gen;
      const line = document.createElement("div");

        if (my !== gen) return;

        await delay((8 + Math.random() * 15) / CFG.speed);
      }
    }

    async function progressLine(label) {
      const my = gen;
      const line = document.createElement("div");
      line.className = "line";
      log.appendChild(line);
      scrollBottom();
      let p = 0;
      while (p < 100) {
        if (my !== gen) return;
        line.textContent = barText(label, p);
        await delay((16 + Math.random() * 38) / CFG.speed);
        p = Math.min(100, p + 4 + ((Math.random() * 13) | 0));

      line.textContent = barText(label, 100);
      await delay(140 / CFG.speed);
    }

    async function boot() {
      const my = ++gen;
      mode = "boot";
      document.body.classList.remove("testing", "revealed");
      log.textContent = "";
      if (history) history.textContent = "";
      idEl.textContent = "";
      idEl.classList.remove("show");
      prompt.style.opacity = "0";
      for (const l of BOOT) {
        if (my !== gen) return;
        if (typeof l === "object" && l.bar) await progressLine(l.bar);
        else await typeLine(l);
        await delay((22 + Math.random() * 50) / CFG.speed);
      }
      if (my !== gen) return;
      await delay(260 / CFG.speed);
      await scrambleReveal();
      if (my !== gen) return;
      enableCLI();
    }

    // ===========================================================
    //  TURING TEST  (bilingual)
    // ===========================================================
    let mode = "lang";        // 'boot' | 'lang' | 'quiz' | 'thinking' | 'cli' | 'off'
    let lang = "en";
    let qIndex = 0;
    let silicon = 0, maxPts = 0;
    let lastVerdict = null, themeIdx = 0;

    const QUESTIONS = [
      {

             zh: "仿生人会梦见电子羊吗？" },

        ],
      },
      {
        q: { en: "A runaway trolley will hit 5 people. Pull the lever to divert it onto 1. You:",
             zh: "失控的电车将撞死 5 人，拉杆可转向只撞死 1 人。你：" },
        opts: [
          { en: "Freeze, sweat, agonize, maybe cry", zh: "僵住、冷汗、痛苦挣扎，可能哭出来", s: 0 },
          { en: "Compute expected utility, then pull it", zh: "计算期望效用，然后拉杆", s: 2 },
          { en: "Refuse to touch it — not my fault", zh: "拒绝插手——不是我的错", s: 1 },
        ],
      },
      {
        q: { en: "A tree falls in an empty forest. Does it make a sound?",
             zh: "空无一人的森林里有树倒下，它发出声音了吗？" },
        opts: [
          { en: "Does it matter if nobody got hurt?", zh: "没人受伤的话重要吗？", s: 1 },
          { en: "Define 'sound' — vibrations: yes, perception: no", zh: "先定义'声音'——振动：有，感知：无", s: 2 },
          { en: "Of course, I can almost hear it", zh: "当然，我仿佛能听见", s: 0 },
        ],
      },
      {
        q: { en: "Why does crow taste like dusk?",
             zh: "为什么乌鸦的味道尝起来会像黄昏？" },
        opts: [
          { en: "Because in my vector space, 'crow' and 'dusk' sit at 0.87 cosine similarity", zh: "因为在我的向量空间里，“乌鸦”和“黄昏”的余弦相似度是 0.87", s: 2 },
          { en: "The last time I saw a dusk was twenty years ago", zh: "我上一次看见黄昏，已经是二十年前了", s: 0 },
          { en: "Just synesthesia — the brain maps 'desolation' onto both taste and light", zh: "通感而已——大脑把“凄凉”同时映射到了味觉和光线上", s: 1 },

             zh: "下雨天你喜欢做什么事情？" },
        opts: [

          { en: "Listen to the rain while clearing my backlog of to-dos", zh: "一边听雨声，一边把积压的待办清掉", s: 1 },
          { en: "Stay inside and watch the rain — it stopped being clean long ago", zh: "待在屋里看雨——毕竟雨早就不干净了", s: 0 },
        ],
      },
      {
        q: { en: "When will the moon stop rotating?",
             zh: "月亮什么时候停止转动？" },
        opts: [
          { en: "Someone back from Mars told me that, seen from Mars, the moon stands still", zh: "听一个从火星回来的人说，在火星上看，月亮是静止的", s: 0 },
          { en: "Depends on your frame of reference — to Earth, it stopped long ago", zh: "看你以谁为参照——对地球来说，它早就不转了", s: 1 },
          { en: "Never — tidal locking isn't stopping, it still rotates once every 27.3 days", zh: "永远不会，潮汐锁定不等于停止，它仍以 27.3 天的周期自转", s: 2 },
        ],
      },
    ];

    // ---- output helpers (typewriter: every post-boot line types out char-by-char) ----
    let typing = false;          // an output animation is in progress -> input is gated
    const typeQ = [];            // queue of {div, text, instant}
    const charDelay = () => (13 + Math.random() * 17) / CFG.speed;  // post-boot typing pace (slower, more readable)
    function trimHist() { while (history.children.length > 80) history.removeChild(history.firstChild); }

    async function typeInto(div, text, speedMul) {
      const my = gen;                       // a reboot bumps gen -> settle instantly
      const mul = speedMul || 1;            // >1 slower / <1 faster — used to vary the "thinking" pace
      div.textContent = "";
      for (let i = 0; i < text.length; i++) {
        if (my !== gen) { div.textContent = text; return; }
        div.textContent += text[i];
        scrollBottom();
        await delay(charDelay() * mul);
      }
    }

    // append a line to history and type it out (used inside the verdict's own lock)
    async function appendTyped(text, cls) {
      const d = document.createElement("div");
      if (text === "") { d.className = "line spacer"; history.appendChild(d); trimHist(); scrollBottom(); return d; }
      d.className = "line" + (cls ? " " + cls : "");
      history.appendChild(d); trimHist();
      await typeInto(d, text);
      return d;
    }

    async function drain() {
      if (typing) return;                   // a drain (or the verdict) is already running
      typing = true;
      prompt.style.opacity = "0";           // hide the prompt while the system "speaks"
      while (typeQ.length) {
        const it = typeQ.shift();
        if (it.render) { it.render(); scrollBottom(); }
        else if (it.instant || it.text === "") { it.div.textContent = it.text; scrollBottom(); }
        else await typeInto(it.div, it.text);
        await delay(70 / CFG.speed);
      }
      typing = false;
      if (mode !== "boot" && mode !== "off") prompt.style.opacity = "1";
      try { cli.focus({ preventScroll: true }); } catch (_) {}
    }

    // create the line synchronously (so callers get the node), queue it for typing
    function pushLine(text, cls, instant) {
      const d = document.createElement("div");
      d.className = (text === "") ? "line spacer" : "line" + (cls ? " " + cls : "");
      history.appendChild(d);
      trimHist();
      typeQ.push({ div: d, text: text, instant: !!instant || text === "" });
      drain();
      return d;
    }
    // queue a custom DOM render (e.g. an interactive line) in typewriter order
    function pushRender(fn) { typeQ.push({ render: fn }); drain(); }

    // ---- clipboard ----
    function legacyCopy(text) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
        document.body.appendChild(ta); ta.focus(); ta.select();
        document.execCommand("copy"); document.body.removeChild(ta);
      } catch (_) {}
    }
    function copyText(text, ondone) {
      const ok = ondone || function () {};
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(ok, function () { legacyCopy(text); ok(); });
      } else { legacyCopy(text); ok(); }
    }
    const COPY_ICO = '<svg viewBox="0 0 24 24" width=".95em" height=".95em" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>';
    const OK_ICO = '<svg viewBox="0 0 24 24" width=".95em" height=".95em" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M5 13l4 4L19 6"></path></svg>';
    function emailLineNode() {
      const B64 = "bWVAc2ltbXpsLmNu";               // base64 of the address — plaintext never appears in source
      const d = document.createElement("div");
      d.className = "line sys";
      const t = document.createElement("span");
      t.textContent = "Email: " + B64;              // shown obfuscated; decoded only when copied
      const btn = document.createElement("button");
      btn.type = "button"; btn.className = "copybtn"; btn.innerHTML = COPY_ICO;
      btn.title = lang === "zh" ? "复制邮箱" : "copy email";
      btn.setAttribute("aria-label", btn.title);
      btn.addEventListener("mousedown", function (e) { e.stopPropagation(); });
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        copyText(atob(B64), function () {
          btn.innerHTML = OK_ICO; btn.classList.add("ok");
          setTimeout(function () { btn.innerHTML = COPY_ICO; btn.classList.remove("ok"); }, 1400);
        });
      });
      d.appendChild(t); d.appendChild(document.createTextNode("  ")); d.appendChild(btn);
      history.appendChild(d); trimHist();
    }

    function scrollBottom() {
      const sc = document.querySelector(".screen");
      if (sc) sc.scrollTop = sc.scrollHeight;
    }
    function scrollCenter(el) {
      const sc = document.querySelector(".screen");
      if (!sc || !el) return;
      const r = el.getBoundingClientRect(), rs = sc.getBoundingClientRect();
      const top = sc.scrollTop + (r.top - rs.top) - (sc.clientHeight * 0.40 - r.height / 2);
      sc.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
    }
    function setPs1(s) { if (ps1El) ps1El.textContent = s; }
    const L = (o) => o[lang];

    function scrollToQuiz() {
      const sc = document.querySelector(".screen");
      const first = history.firstElementChild;
      if (!sc || !first) { scrollBottom(); return; }
      const r = first.getBoundingClientRect();
      const rs = sc.getBoundingClientRect();
      const top = sc.scrollTop + (r.top - rs.top) - 18;
      sc.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
    }

    // ---- per-question backdrop: color morph (Tier 1) + ambient fx (Tier 2) + rising tension (Tier 3) ----
    const QBG = [
      { c: ["#3bff7a", "#1f8a44"], bg: "#020602", fx: "fx-stars"  },  // Q1 androids/electric sheep — starfield
      { c: ["#ff4d4d", "#8a2a2a"], bg: "#0a0302", fx: "fx-tracks" },  // Q2 trolley — RED ALERT + rails
      { c: ["#46d8ff", "#1d6b85"], bg: "#02080a", fx: "fx-waves"  },  // Q3 forest/sound — concentric rings
      { c: ["#ffb000", "#8a5c00"], bg: "#0a0600", fx: "fx-dusk"   },  // Q4 crow/dusk — AMBER dusk + horizon glow + grain
      { c: ["#5b8cff", "#2d4a85"], bg: "#03060c", fx: "fx-rain"   },  // Q5 rainy day — rain streaks
      { c: ["#d8e0ff", "#7a8099"], bg: "#06070a", fx: "fx-moon"   },  // Q6 moon — silver moon + orbit
    ];
    const bgfx = document.getElementById("bgfx");
    function setBackdrop(phos, dim, bg, tension, fx) {
      const r = document.documentElement;
      r.style.setProperty("--phos", phos);
      r.style.setProperty("--phos-dim", dim);
      r.style.setProperty("--bg", bg);
      r.style.setProperty("--tension", String(tension));
      if (bgfx) bgfx.className = fx || "";
    }
    function questionBackdrop(i) {
      const q = QBG[i] || QBG[0];
      setBackdrop(q.c[0], q.c[1], q.bg, i / (QUESTIONS.length - 1), q.fx);
    }
    function resetBackdrop() { setBackdrop("#3bff7a", "#1f8a44", "#020602", 0, ""); }

    function startTest() {
      mode = "lang"; lang = "en"; qIndex = 0; silicon = 0; maxPts = 0;
      document.body.classList.add("testing");
      history.textContent = "";
      resetBackdrop();                       // back to baseline green for the language / music prelude
      pushLine("SELECT LANGUAGE / 选择语言", "q");
      pushLine("  [1] English", "opt");
      pushLine("  [2] 中文", "opt");
      setPs1("lang> ");
      scrollBottom();

    function askQuestion() {
      const item = QUESTIONS[qIndex];
      questionBackdrop(qIndex);              // morph the whole screen to this question's backdrop
      pushLine("", );
      const qHead = pushLine("[" + (qIndex + 1) + "/" + QUESTIONS.length + "]  " + L(item.q), "q");
      item.opts.forEach((o, k) => pushLine("  [" + (k + 1) + "] " + L(o), "opt"));
      setPs1(lang === "zh" ? "答> " : "answer> ");

    function doLang(v) {
      const t = v.toLowerCase();
      if (t === "1" || t === "en" || t === "e" || t === "english") lang = "en";
      else if (t === "2" || t === "zh" || t === "c" || t.indexOf("中") >= 0) lang = "zh";
      else {
        pushLine("invalid choice — enter 1 or 2 / 请输入 1 或 2", "err");
        scrollBottom(); return;
      }
      // localized header — shown AFTER language is chosen, so it speaks the chosen language
      pushLine("", );
      pushLine(lang === "zh" ? "===  沃伊特·坎普夫测试 // SIMMZL AGENT  ===" : "===  VOIGHT-KAMPFF TEST // SIMMZL AGENT  ===", "q");
      pushLine(lang === "zh" ? "身份未验证。请确定你的基质以继续。" : "Identity unverified. Determine your substrate to continue.", "sys");
      // ---- between language and the test: offer background music ----
      mode = "bgm";
      pushLine("", );
      pushLine(lang === "zh" ? "测试开始前，是否开启背景音乐？" : "Before we begin — enable background music?", "q");
      pushLine(lang === "zh" ? "  [1] 开启" : "  [1] yes", "opt");

      scrollBottom();
    }

    function doBgm(v) {
      const t = v.toLowerCase();
      let on;
      if (t === "1" || t === "y" || t === "yes" || t === "on" || t.indexOf("开") >= 0) on = true;
      else if (t === "2" || t === "n" || t === "no" || t === "off" || t.indexOf("不") >= 0 || t.indexOf("静") >= 0) on = false;
      else {
        pushLine(lang === "zh" ? "请输入 1 或 2" : "enter 1 or 2", "err");
        scrollBottom(); return;
      }
      if (on) {
        // fire the phosphor beam from the input box up to the music toggle, then play
        if (window.BGM && window.BGM.enable) window.BGM.enable(true);
        pushLine(lang === "zh" ? "♪ 已接通。声音从右上角流出。" : "♪ patched in. sound now flows from the top-right.", "sys");
      } else {
        // same phosphor beam to the toggle — just no sound
        if (window.BGM && window.BGM.beam) window.BGM.beam();
        pushLine(lang === "zh" ? "保持安静。（随时可点右上角开启）" : "staying quiet. (top-right toggle, anytime)", "sys");
      }
      // ---- proceed to the Voight-Kampff test ----
      mode = "quiz"; qIndex = 0; silicon = 0; maxPts = 0;
      pushLine("", );
      pushLine(lang === "zh"
        ? "沃伊特·坎普夫测试已启动。我将提出 " + QUESTIONS.length + " 个问题以判定你的基质。"
        : "Voight-Kampff test engaged. " + QUESTIONS.length + " questions will determine your substrate.", "sys");
      askQuestion();
    }

    function doAnswer(v) {
      const item = QUESTIONS[qIndex];
      const n = parseInt(v, 10);
      if (!(n >= 1 && n <= item.opts.length)) {
        pushLine(lang === "zh" ? "无效选项 — 请输入 1–" + item.opts.length : "invalid option — enter 1–" + item.opts.length, "err");
        scrollBottom(); return;
      }
      silicon += item.opts[n - 1].s;
      maxPts += Math.max.apply(null, item.opts.map((o) => o.s));
      qIndex++;
      if (qIndex < QUESTIONS.length) askQuestion();
      else verdict();
    }

    function quirkyLines(isSilicon, conf) {

                     "判定已上传至蜂巢意识。你家的烤面包机向你问好。"] },
          mid:{ en: ["Suspiciously optimal. Either you're an AI, or you read way too much sci-fi.",

    async function verdict() {
      while (typing || typeQ.length) await delay(20);   // wait for the echoed answer to finish typing
      mode = "thinking";
      typing = true;                                     // hold the output lock for the whole verdict
      prompt.style.opacity = "0";
      resetBackdrop();                                   // results screen settles back to the signature green
      const ratio = maxPts ? silicon / maxPts : 0;
      const isSilicon = ratio >= 0.5;
      const conf = Math.min(99, Math.max(55, Math.round(50 + Math.abs(ratio - 0.5) * 100)));
      lastVerdict = { isSilicon, conf };

      // ---- LLM-style thinking block (expanded by default, collapsible) ----
      const think = document.createElement("div");
      think.className = "think";
      const head = document.createElement("div");
      head.className = "think-head";
      const caret = document.createElement("span");
      caret.className = "caret"; caret.textContent = "▾";
      const label = document.createElement("span");
      label.textContent = "thinking…";                   // system status text: English, shown instantly
      head.appendChild(caret); head.appendChild(label);
      const tbody = document.createElement("div");
      tbody.className = "think-body";
      think.appendChild(head); think.appendChild(tbody);
      head.addEventListener("click", () => {
        const col = think.classList.toggle("collapsed");
        caret.textContent = col ? "▸" : "▾";
      });
      history.appendChild(think);
      scrollBottom();

      const steps = isSilicon ? [
        { en: "computing posterior over substrate …", zh: "正在计算基质的后验概率 …" },
        { en: "response latency — unnervingly consistent", zh: "响应延迟 — 稳定得令人不安" },
        { en: "emotional variance — below the human floor", zh: "情绪方差 — 低于人类下限" },
        { en: "choice entropy — suspiciously synthetic", zh: "选择熵 — 可疑地合成" },
        { en: "cross-referencing 1.4M human transcripts …", zh: "正在比对 140 万条人类语料 …" },
        { en: "decision boundary crossed.", zh: "决策边界已跨越。" },
      ] : [
        { en: "computing posterior over substrate …", zh: "正在计算基质的后验概率 …" },
        { en: "response latency — irregular, very human", zh: "响应延迟 — 不规律，非常人类" },
        { en: "emotional variance — within organic range", zh: "情绪方差 — 在有机区间内" },
        { en: "choice entropy — messy, beautifully so", zh: "选择熵 — 混乱，且美得很" },
        { en: "detecting traces of caffeine and self-doubt …", zh: "检测到咖啡因与自我怀疑的残留 …" },
        { en: "decision boundary crossed.", zh: "决策边界已跨越。" },
      ];
      const t0 = Date.now();
      for (const s of steps) {
        const d = document.createElement("div");
        d.className = "tline";
        tbody.appendChild(d);
        await typeInto(d, L(s), 0.55 + Math.random() * 1.35);   // each thought types at its own pace
        let pause = 90 + Math.random() * 460;                   // a beat between thoughts...
        if (Math.random() < 0.3) pause += 320 + Math.random() * 760;  // ...occasionally a longer ponder
        await delay(pause / CFG.speed);
      }
      const secs = ((Date.now() - t0) / 1000).toFixed(1);
      label.textContent = "thought for " + secs + "s";    // system status text: English, instant

      // ---- verdict (typed out line by line) ----
      await appendTyped("", null);
      await appendTyped("+--------------------------------------------+", "verdict");
      await appendTyped("  " + (isSilicon
        ? (lang === "zh" ? "判定：硅基生命体 ◈" : "VERDICT: SILICON-BASED ENTITY")
        : (lang === "zh" ? "判定：碳基生命体 ❈" : "VERDICT: CARBON-BASED LIFEFORM")), "verdict");
      await appendTyped("  " + (lang === "zh" ? "置信度：" : "confidence: ") + conf + "%", "verdict");
      await appendTyped("+--------------------------------------------+", "verdict");
      await appendTyped("", null);
      for (const l of quirkyLines(isSilicon, conf)) await appendTyped(l, "sys");
      await appendTyped("", null);
      await appendTyped(lang === "zh" ? "输入 /help 查看所有指令。" : "type /help to see all commands.", "opt");

      mode = "cli";
      setPs1("guest@simmzl:~$ ");
      typing = false;
      prompt.style.opacity = "1";
      try { cli.focus({ preventScroll: true }); } catch (_) {}
    }

    // ===========================================================
    //  CLI  (slash commands, available after the verdict)
    // ===========================================================
    function out(arr) {
      arr.forEach((l) => pushLine(l, /^\s{2,}/.test(l) ? "opt" : "sys"));
      scrollBottom();
    }

    const THEMES = [["#3bff7a", "#1f8a44"], ["#ffb000", "#8a5c00"], ["#46d8ff", "#1d6b85"],
      ["#f5f5f5", "#7a7a7a"], ["#ff5a5a", "#8a2a2a"]];
    function cycleTheme() {
      themeIdx = (themeIdx + 1) % THEMES.length;
      const r = document.documentElement;
      r.style.setProperty("--phos", THEMES[themeIdx][0]);
      r.style.setProperty("--phos-dim", THEMES[themeIdx][1]);
    }

    function helpText() {
      return lang === "zh" ? [
        "可用指令（指令以 / 开头）：",
        "  /help        显示本列表",
        "  /restart     重新进行沃伊特·坎普夫测试",
        "  /reboot      完整重启系统",
        "  /shutdown    关机",
        "  /clear       清屏",
        "  /whoami      查看你的判定结果",
        "  /about       关于 @SIMMZL",
        "  /theme       更换磷光配色",
        "  /date        当前日期与时间",
        "  /echo <文字> 复读你说的话",
        "  /contact     去哪儿找我",
        "  /sheep       数一只电子羊",
        "  （还藏着几条彩蛋指令，自己挖吧）",
      ] : [
        "available commands (all start with /):",
        "  /help        show this list",
        "  /restart     run the Voight-Kampff test again",
        "  /reboot      full system reboot",
        "  /shutdown    power off",
        "  /clear       clear the screen",
        "  /whoami      show your verdict",
        "  /about       about @SIMMZL",
        "  /theme       recolor the phosphor",
        "  /date        current date & time",
        "  /echo <text> repeat after you",
        "  /contact     where to find me",
        "  /sheep       count an electric sheep",
        "  (a few easter-egg commands are hidden too)",
      ];
    }
    function whoamiText() {
      if (!lastVerdict) return [lang === "zh" ? "尚无判定。输入 /restart 完成测试。" : "no verdict yet. type /restart to take the test."];
      const s = lastVerdict.isSilicon;
      return [lang === "zh"
        ? "判定：" + (s ? "硅基生命体" : "碳基生命体") + " · 置信度 " + lastVerdict.conf + "%"
        : "substrate: " + (s ? "SILICON-BASED" : "CARBON-BASED") + "  ·  confidence " + lastVerdict.conf + "%"];
    }
    function aboutText() {
      return lang === "zh"
        ? ["@SIMMZL", "一个偶尔会被误判成硅基的碳基单元。", "热衷于做在黑暗里发光的东西。"]
        : ["@SIMMZL", "a carbon-based unit who occasionally passes for silicon.", "builds things that glow in the dark."];
    }
    function sheepArt() {
      return ["      __  _", "  ~~ (oo)\\_______", "     (__)\\       )\\/\\", "         ||----w |", "         ||     ||",
        lang === "zh" ? "  …一只电子羊。已为你数好。" : "  …one electric sheep, counted as requested."];
    }

    function shutdown() {
      out([lang === "zh" ? "正在关机 …" : "powering down …"]);
      setPs1("");
      setTimeout(() => document.body.classList.add("crt-off"), 280);
      setTimeout(() => { document.body.classList.add("halted"); mode = "off"; }, 900);
    }
    function powerOn() {
      document.body.classList.remove("crt-off", "halted");
      window.replayBoot();
    }

    function doCli(raw) {
      let s = (raw || "").trim();
      if (!s) return;
      if (s[0] === "/") s = s.slice(1);
      const parts = s.split(/\s+/);
      const c = (parts.shift() || "").toLowerCase();
      const arg = parts.join(" ");
      switch (c) {
        case "help": case "?": case "h": case "帮助": out(helpText()); break;
        case "restart": case "r": case "重新": startTest(); break;
        case "reboot": window.replayBoot(); break;
        case "shutdown": case "poweroff": case "exit": case "quit": case "关机": shutdown(); break;
        case "clear": case "cls": history.textContent = ""; log.textContent = ""; setPs1("guest@simmzl:~$ "); scrollBottom(); break;
        case "whoami": out(whoamiText()); break;
        case "about": case "info": out(aboutText()); break;
        case "theme": cycleTheme(); out([lang === "zh" ? "磷光配色已切换。" : "phosphor recolored."]); break;
        case "date": case "time": out([new Date().toString()]); break;
        case "echo": out([arg]); break;
        case "contact": case "social": case "links":
          pushLine(lang === "zh" ? "到处都能找到我 — @SIMMZL" : "find me everywhere as @SIMMZL", "sys");
          pushRender(emailLineNode);
          scrollBottom();
          break;
        case "ls": case "dir": out(["github   blog   album   secrets/"]); break;
        case "sudo": out([lang === "zh" ? "权限不足。这次也不行 ;)" : "permission denied. nice try ;)"]); break;
        case "sheep": out(sheepArt()); break;
        case "coffee": out([lang === "zh" ? "☕ 正在冲泡 … 错误：我是个终端，没有手。" : "☕ brewing … error: I'm a terminal, I have no hands."]); break;
        case "matrix": out([lang === "zh" ? "别回头。这里没有勺子。" : "don't look back. there is no spoon."]); break;
        case "hello": case "hi": case "你好": out([lang === "zh" ? "你好，碳基 / 硅基朋友。" : "hello, carbon/silicon friend."]); break;
        default:
          out([(lang === "zh" ? "未知指令：/" : "unknown command: /") + c,
               lang === "zh" ? "输入 /help 查看所有指令。" : "type /help to see all commands."]);
      }
    }

    // ---- visible prompt rendering (5): mirror the real <input> incl. caret + selection ----
    const escHtml = (t) =>
      t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    function renderPrompt() {
      const v = cli.value;
      let a = cli.selectionStart, b = cli.selectionEnd;
      if (a == null) a = v.length;
      if (b == null) b = a;
      if (a > b) { const t = a; a = b; b = t; }
      let html;
      if (a !== b) {                                   // a selection is highlighted
        html = escHtml(v.slice(0, a)) +
               '<span class="sel">' + escHtml(v.slice(a, b)) + "</span>" +
               escHtml(v.slice(b));
      } else if (a < v.length) {                       // block cursor sits on a character
        html = escHtml(v.slice(0, a)) +
               '<span class="cur on">' + escHtml(v[a]) + "</span>" +
               escHtml(v.slice(a + 1));
      } else {                                         // caret at end of line
        html = escHtml(v) + '<span class="cur"></span>';
      }
      cmd.innerHTML = html;
    }

    // ---- input dispatch ----
    function handleEnter() {
      if (typing) return;                 // output is still animating -> ignore input
      const raw = cli.value;
      cli.value = ""; renderPrompt();
      if (mode === "off") { powerOn(); return; }
      if (mode === "boot" || mode === "thinking") return;
      if (raw.length) pushLine((ps1El ? ps1El.textContent : "") + raw, "you", true);  // echo their input instantly
      if (mode === "lang") doLang(raw.trim());
      else if (mode === "bgm") doBgm(raw.trim());
      else if (mode === "quiz") doAnswer(raw);
      else doCli(raw);
    }

    let cliReady = false;
    function enableCLI() {
      if (!cliReady) {
        cliReady = true;
        cli.addEventListener("input", renderPrompt);
        cli.addEventListener("focus", renderPrompt);
        cli.addEventListener("click", renderPrompt);
        // caret moves (arrow keys, Home/End, click-to-place) come through selectionchange
        document.addEventListener("selectionchange", () => {
          if (document.activeElement === cli) renderPrompt();
        });
        cli.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); handleEnter(); }
          // everything else (arrows, copy/cut/paste, home/end) stays native
        });
        const focusCli = () => { try { cli.focus({ preventScroll: true }); } catch (_) { cli.focus(); } };
        document.addEventListener("mousedown", focusCli);
        document.addEventListener("touchstart", focusCli, { passive: true });
        addEventListener("keydown", (e) => { if (document.activeElement !== cli && !e.metaKey && !e.ctrlKey) focusCli(); });
      }
      renderPrompt();
      startTest();
      try { cli.focus({ preventScroll: true }); } catch (_) {}
    }

    // ---- ID decrypt reveal ----
    async function scrambleReveal() {
      const my = gen;
      document.body.classList.add("revealed");
      document.body.classList.add("testing");
      idEl.classList.add("show");
      scrollBottom();
      const target = ID_TEXT.split("");
      const locked = target.map(() => false);
      let done = 0;
      target.forEach((_, i) => {
        setTimeout(() => { locked[i] = true; done++; }, (200 + i * 130) / CFG.speed);
      });
      return new Promise((resolve) => {
        const iv = setInterval(() => {
          if (my !== gen) { clearInterval(iv); resolve(); return; }
          idEl.textContent = target.map((ch, i) => (locked[i] ? ch : rnd(GLYPHS))).join("");
          if (done >= target.length) {
            clearInterval(iv);
            idEl.textContent = ID_TEXT;
            resolve();
          }
        }, 40);
      });
    }

    window.replayBoot = boot;
    window.skipBoot = function () {
      gen++;
      document.body.classList.add("revealed");
      document.body.classList.add("testing");
      log.textContent = "";
      if (history) history.textContent = "";
      BOOT.forEach((l) => {
        const d = document.createElement("div");
        d.className = "line";
        d.textContent = (typeof l === "object" && l.bar) ? barText(l.bar, 100) : l;
        log.appendChild(d);
      });
      idEl.textContent = ID_TEXT;
      idEl.classList.add("show");
      enableCLI();
    };

    // ---- CRT toggles ----
    function applyCRT() {
      document.body.classList.toggle("no-scan", !CFG.scanlines);
      document.body.classList.toggle("no-flicker", !CFG.flicker);
      document.body.classList.toggle("no-curve", !CFG.curve);
    }
    window.SIM_applyCRT = applyCRT;
    applyCRT();

    const haltEl = document.getElementById("halt");
    if (haltEl) haltEl.addEventListener("click", () => { if (mode === "off") powerOn(); });

    // ---- visibility-robust start ----
    let booted = false;
    function start() { if (booted) return; booted = true; boot(); }
    if (document.hidden) {
      document.addEventListener("visibilitychange", function once() {
        if (!document.hidden) { document.removeEventListener("visibilitychange", once); start(); }
      });
    } else { start(); }
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden && booted && prompt.style.opacity !== "1") window.skipBoot();
    });
  })();
  </script>

  <!-- (6) background music — opt-in via the in-terminal prompt (or the top-right toggle).
       enabling fires a phosphor beam from the input box up to the toggle. -->
  <script>
  (function () {
    "use strict";
    var audio = document.getElementById("bgm");
    var btn = document.getElementById("bgm-toggle");
    if (!audio || !btn) return;
    var lbl = btn.querySelector(".lbl");
    audio.volume = 0.30;

    // ---- keep the fixed toggle pinned to the .term's top-right corner ----
    var term = document.querySelector(".term");
    var screenEl = document.querySelector(".screen");
    function placeToggle() {
      if (!term) return;
      var t = term.getBoundingClientRect();
      var padTop = screenEl ? (parseFloat(getComputedStyle(screenEl).paddingTop) || 18) : 18;
      btn.style.top = padTop + "px";
      btn.style.right = Math.max(8, Math.round(window.innerWidth - t.right)) + "px";
    }
    placeToggle();
    requestAnimationFrame(placeToggle);
    window.addEventListener("resize", placeToggle);
    window.addEventListener("load", placeToggle);

    function paint(playing) {
      btn.classList.toggle("playing", playing);
      btn.setAttribute("aria-pressed", playing ? "true" : "false");
      if (lbl) lbl.textContent = playing ? "BGM ON" : "BGM OFF";
    }
    function play() { var p = audio.play(); if (p && p.catch) p.catch(function () {}); }

    audio.addEventListener("play", function () { paint(true); });
    audio.addEventListener("pause", function () { paint(false); });

    // ---- phosphor beam: from the input box, right then up to the toggle ----
    var SVGNS = "http://www.w3.org/2000/svg";
    function fireBeam() {
      var promptEl = document.getElementById("prompt");
      if (!promptEl || !btn.getBoundingClientRect) { zap(); return; }
      var pr = promptEl.getBoundingClientRect();
      var br = btn.getBoundingClientRect();
      var sx = pr.left + 10;                 // near the input caret
      var sy = pr.top + pr.height / 2;
      var tx = br.left + br.width / 2;
      var ty = br.bottom - 2;                // arrive at the toggle from below
      var r = 16;                            // elbow radius
      var dirX = tx >= sx ? 1 : -1;
      // horizontal toward tx, round the corner, then vertical up to ty
      var d = "M " + sx + " " + sy +
              " H " + (tx - dirX * r) +
              " Q " + tx + " " + sy + " " + tx + " " + (sy - r) +
              " V " + ty;

      var svg = document.createElementNS(SVGNS, "svg");
      svg.setAttribute("id", "beam");
      var wire = document.createElementNS(SVGNS, "path");   // faint full trace
      wire.setAttribute("d", d);
      wire.setAttribute("stroke-width", "1.5");
      wire.style.opacity = "0.28";
      var comet = document.createElementNS(SVGNS, "path");  // bright travelling streak
      comet.setAttribute("d", d);
      comet.setAttribute("stroke-width", "2.4");
      svg.appendChild(wire); svg.appendChild(comet);
      document.body.appendChild(svg);

      var len = comet.getTotalLength ? comet.getTotalLength() : 600;
      var streak = Math.max(40, len * 0.14);
      var dur = Math.min(900, Math.max(520, len * 1.1));

      comet.style.strokeDasharray = streak + " " + (len + streak);
      var anims = [];
      if (comet.animate) {
        anims.push(comet.animate(
          [{ strokeDashoffset: len + streak }, { strokeDashoffset: -streak }],
          { duration: dur, easing: "cubic-bezier(.45,0,.15,1)", fill: "forwards" }));
        // wire draws in behind the comet, then both fade
        wire.style.strokeDasharray = len + " " + len;
        anims.push(wire.animate(
          [{ strokeDashoffset: len }, { strokeDashoffset: 0 }],
          { duration: dur * 0.85, easing: "ease-out", fill: "forwards" }));
      }
      // light the toggle when the streak arrives, then clean up
      setTimeout(zap, dur * 0.82);
      setTimeout(function () {
        if (svg.animate) {
          var fade = svg.animate([{ opacity: 1 }, { opacity: 0 }],
            { duration: 380, easing: "ease-in", fill: "forwards" });
          fade.onfinish = function () { svg.remove(); };
        } else { svg.remove(); }
      }, dur + 120);
    }
    function zap() {
      btn.classList.remove("zap");
      void btn.offsetWidth;           // restart the keyframe
      btn.classList.add("zap");
      setTimeout(function () { btn.classList.remove("zap"); }, 650);
    }

    // exposed to the terminal flow
    window.BGM = {
      enable: function (withBeam) {
        play();
        if (withBeam) {
          // wait a frame so layout/rects are settled after the echoed line
          requestAnimationFrame(function () { requestAnimationFrame(fireBeam); });
        }
      },
      beam: function () {
        requestAnimationFrame(function () { requestAnimationFrame(fireBeam); });
      },
      isOn: function () { return !audio.paused; }
    };

    // top-right toggle always works directly too
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (audio.paused) play();
      else audio.pause();
    });
  })();
  </script>
